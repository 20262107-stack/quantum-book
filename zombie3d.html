<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNDEAD // 3D ZOMBIE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050807;color:#e6eee8;font-family:Inter,system-ui,'Noto Sans KR',sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}
#stage{position:fixed;inset:0}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 20%,#02040355 65%,#000 100%)}#hud{position:fixed;inset:0;pointer-events:none;padding:clamp(18px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow{font-size:11px;letter-spacing:.3em;color:#91b39b}.title{font-size:clamp(30px,6vw,68px);font-weight:950;letter-spacing:-.07em;line-height:.9;margin:12px 0;text-shadow:0 0 24px #8cfa9c20}.title span{color:#8cf59a}.sub{font-size:12px;letter-spacing:.14em;color:#8b9c90}.status{font-size:11px;letter-spacing:.16em;color:#a6c2ac;border:1px solid #52705a66;background:#08100bd9;padding:10px 13px}.bottom{display:flex;justify-content:space-between;align-items:end;gap:20px}.hint{font-size:12px;color:#a5b5a9;line-height:1.8}.controls{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}button{background:#0b130e;border:1px solid #55745d;color:#d9f4df;padding:11px 14px;font-weight:750;letter-spacing:.06em;cursor:pointer}button:hover,button.active{background:#a0f5a9;color:#061008;border-color:#a0f5a9}#crosshair{position:fixed;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);opacity:.35;pointer-events:none}#crosshair:before,#crosshair:after{content:'';position:absolute;background:#c3f5cc}#crosshair:before{width:1px;height:26px;left:12px}#crosshair:after{height:1px;width:26px;top:12px}.scan{position:fixed;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(0deg,transparent 0 3px,#b5ffc0 4px,transparent 5px)}@media(max-width:600px){.top{flex-direction:column}.status{display:none}.bottom{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}.hint{font-size:11px}}
</style></head><body>
<div id="stage"></div><div id="vignette"></div><div class="scan"></div><div id="crosshair"></div>
<div id="hud"><div class="top"><div><div class="eyebrow">FIELD FILE 001 / BIOHAZARD</div><div class="title">THE <span>UNDEAD</span></div><div class="sub">INTERACTIVE 3D SPECIMEN · DO NOT APPROACH</div></div><div class="status">● CONTAINMENT FAILED<br><br>THREAT LEVEL : SEVERE</div></div><div class="bottom"><div class="hint">DRAG — ROTATE VIEW<br>SCROLL — ZOOM IN / OUT<br>MOVE CLOSER. IF YOU DARE.</div><div class="controls"><button id="rotate" class="active">AUTO ROTATE: ON</button><button id="lights">LIGHTS: FLICKER</button><button id="reset">RESET VIEW</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
(()=>{if(!window.THREE){document.querySelector('.hint').textContent='3D engine failed to load. Check your internet connection.';return}
const THREE=window.THREE, host=document.getElementById('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050907);scene.fog=new THREE.FogExp2(0x050907,.052);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(4.1,2.5,7.4);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bb8a0,0x101610,1.6));
const key=new THREE.SpotLight(0xc9ffd0,90,25,Math.PI/5,.65,1.4);key.position.set(3,8,5);key.castShadow=true;scene.add(key);
const rim=new THREE.PointLight(0x4dff78,25,12);rim.position.set(-3,3,-3);scene.add(rim);
const red=new THREE.PointLight(0x9d1717,8,9);red.position.set(3,1,-2);scene.add(red);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x111713,roughness:.96,metalness:.08}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(30,60,0x2b4731,0x18271c);grid.position.y=-.025;grid.material.transparent=true;grid.material.opacity=.32;scene.add(grid);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const skin=mat(0x596b51),skinLight=mat(0x78846a),darkSkin=mat(0x29382c),shirt=mat(0x242d27),shirt2=mat(0x3a4235),pants=mat(0x202820),boot=mat(0x111713),bone=mat(0xb1b49a),black=mat(0x080b08),blood=mat(0x401817),eye= new THREE.MeshStandardMaterial({color:0xd8ffb4,emissive:0x8cff3d,emissiveIntensity:2.4,roughness:.25});
const zombie=new THREE.Group();scene.add(zombie);
function ell(parent,m,p,s,rot){const o=new THREE.Mesh(new THREE.SphereGeometry(1,18,14),m);o.position.set(...p);o.scale.set(...s);if(rot)o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(parent,m,p,s,rot){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.position.set(...p);if(rot)o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function limb(parent,a,b,r1,r2,m){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A);const o=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),12,1),m);o.position.copy(A).add(B).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;o.receiveShadow=true;parent.add(o);ell(parent,m,a,[r1,r1,r1]);ell(parent,m,b,[r2,r2,r2]);return o}
// legs, crooked stance
limb(zombie,[-.23,1.12,0],[-.38,.59,.08],.15,.115,pants);ell(zombie,[-.38,.57,.08],[.12,.13,.13],null);
limb(zombie,[-.38,.58,.08],[-.48,.13,.17],.105,.085,skin);box(zombie,boot,[-.49,.09,.29],[.22,.14,.38],[0,-.12,0]);
limb(zombie,[.22,1.12,0],[.36,.62,-.06],.15,.115,pants);
limb(zombie,[.36,.62,-.06],[.21,.14,.02],.105,.08,skin);box(zombie,boot,[.18,.09,.14],[.22,.14,.35],[0,.2,0]);
// torso, ragged clothing
ell(zombie,shirt,[0,1.55,0],[.38,.55,.23]);box(zombie,shirt2,[0,1.75,.005],[.58,.38,.38],[0,0,-.05]);
ell(zombie,darkSkin,[-.05,1.47,.18],[.16,.28,.07],[0,0,.18]);ell(zombie,blood,[.18,1.67,.205],[.09,.13,.018]);
for(let i=0;i<5;i++){box(zombie,shirt2,[-.28+i*.12,1.37,.18],[.075,.18,.035],[0,0,(i%2?-.2:.25)])}
box(zombie,shirt,[0,1.16,.015],[.42,.12,.25],[0,0,.05]);ell(zombie,skinLight,[.12,1.55,.22],[.09,.16,.025]);
// neck and head
limb(zombie,[0,1.94,0],[.02,2.12,0],.12,.11,skin);
const head=new THREE.Group();head.position.set(.015,2.31,.015);zombie.add(head);
ell(head,skin,[0,0,0],[.255,.31,.22]);ell(head,skinLight,[-.08,.05,.16],[.13,.14,.09]);ell(head,darkSkin,[.09,-.13,.15],[.16,.08,.09]);
ell(head,black,[-.105,.055,.203],[.071,.075,.025]);ell(head,black,[.105,.06,.203],[.071,.075,.025]);
ell(head,eye,[-.105,.055,.227],[.027,.03,.012]);ell(head,eye,[.105,.06,.227],[.027,.03,.012]);
ell(head,blood,[-.18,-.055,.13],[.06,.09,.025],[0,0,-.5]);ell(head,darkSkin,[.19,.15,.06],[.09,.05,.07]);
ell(head,black,[.01,-.15,.218],[.105,.045,.025]);for(let i=0;i<5;i++)box(head,bone,[-.07+i*.035,-.15,.243],[.022,.04,.012]);
ell(head,skinLight,[-.03,.22,-.02],[.22,.08,.18]);for(let i=0;i<6;i++)ell(head,shirt2,[-.19+i*.07,.27+Math.sin(i)*.02,-.02],[.05,.08,.06]);
// arms raised forward, bony fingers
limb(zombie,[-.3,1.82,0],[-.55,1.58,.13],.15,.11,shirt2);limb(zombie,[-.55,1.58,.13],[-.66,1.3,.39],.105,.075,skin);
ell(zombie,skin,[-.66,1.27,.42],[.105,.12,.09]);for(let i=0;i<4;i++){const x=-.73+i*.045;limb(zombie,[x,1.26,.46],[x-.025,1.14-(i%2)*.04,.51],.023,.013,skinLight)}
limb(zombie,[.3,1.82,0],[.54,1.63,.13],.15,.11,shirt2);limb(zombie,[.54,1.63,.13],[.72,1.42,.4],.105,.075,skin);
ell(zombie,skin,[.74,1.4,.43],[.1,.11,.09]);for(let i=0;i<4;i++){const x=.68+i*.04;limb(zombie,[x,1.39,.47],[x+.025,1.27-(i%2)*.04,.53],.02,.012,skinLight)}
// exposed ribs, wounds and stitches
for(let i=0;i<4;i++){const y=1.55-i*.105;ell(zombie,bone,[-.12,y,.213],[.13,.025,.022],[0,0,-.12]);}
for(let i=0;i<3;i++)ell(zombie,blood,[.23,1.78-i*.09,.205],[.025,.04,.015]);
for(let i=0;i<4;i++)box(zombie,bone,[.12+i*.035,1.46,.24],[.012,.035,.009],[0,0,-.25]);
// floating dust motes
const dustGeo=new THREE.BufferGeometry(),dust=[];for(let i=0;i<300;i++)dust.push((Math.random()-.5)*12,Math.random()*5,(Math.random()-.5)*12);dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dust,3));const dustMat=new THREE.PointsMaterial({color:0x9fcaa5,size:.025,transparent:true,opacity:.48});scene.add(new THREE.Points(dustGeo,dustMat));
// controls: drag to orbit, wheel to zoom
let dragging=false,px=0,py=0,theta=.5,phi=1.32,radius=8.8,auto=true,flicker=true;
function updateCamera(){phi=Math.max(.35,Math.min(2.35,phi));radius=Math.max(3.5,Math.min(14,radius));camera.position.set(Math.sin(phi)*Math.sin(theta)*radius,1.55+Math.cos(phi)*radius*.62,Math.sin(phi)*Math.cos(theta)*radius);camera.lookAt(0,1.3,0)}
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-px)*.008;phi+=(e.clientY-py)*.006;px=e.clientX;py=e.clientY;updateCamera()});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('wheel',e=>{radius+=e.deltaY*.008;updateCamera()},{passive:true});updateCamera();
document.getElementById('rotate').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto);e.currentTarget.textContent='AUTO ROTATE: '+(auto?'ON':'OFF')};
document.getElementById('lights').onclick=e=>{flicker=!flicker;e.currentTarget.classList.toggle('active',flicker);e.currentTarget.textContent='LIGHTS: '+(flicker?'FLICKER':'STEADY')};
document.getElementById('reset').onclick=()=>{theta=.5;phi=1.32;radius=8.8;updateCamera();zombie.rotation.y=0};
let t0=0;function animate(ms){requestAnimationFrame(animate);const t=ms*.001;if(auto&&!dragging)zombie.rotation.y=Math.sin(t*.35)*.45+t*.12;zombie.position.y=Math.sin(t*1.7)*.025;head.rotation.z=Math.sin(t*.9)*.025;head.rotation.x=Math.sin(t*.7)*.025;if(flicker){key.intensity=78+Math.sin(t*19)*7+(Math.random()<.018?-45:0);red.intensity=7+Math.sin(t*5)*2}dustGeo.attributes.position.needsUpdate=false;renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
